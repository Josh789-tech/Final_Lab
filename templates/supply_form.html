
{% extends "base.html" %}

{% block content %}

<div class="container">

    <div class="page-header">
        <h1>Add New Supply</h1>
        <a href="/dashboard" class="btn secondary">
            Back to Dashboard
        </a>
    </div>

    <div class="form-container">

        <form method="POST" action="/supplies/add">

            <div class="form-grid">

                <label>
                    Supply Name
                    <input type="text"
                           name="name"
                           required
                           placeholder="Enter supply name">
                </label>

                <label>
                    Category
                    <input type="text"
                           name="category"
                           required
                           placeholder="Enter category">
                </label>

                <label>
                    Quantity
                    <input type="number"
                           name="quantity"
                           min="0"
                           required>
                </label>

                <label>
                    Unit Price
                    <input type="number"
                           name="price"
                           min="0"
                           step="0.01"
                           required>
                </label>

                <label>
                    Expiration Date
                    <input type="date"
                           name="expiry_date"
                           required>
                </label>

            </div>

            <div class="form-footer">
                <button type="submit" class="btn">
                    Add Supply
                </button>
            </div>

        </form>

    </div>

</div>

{% endblock %}
