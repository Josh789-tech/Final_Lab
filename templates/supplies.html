
{% extends "base.html" %}

{% block content %}

<!-- ADD SUPPLY PAGE -->
<div class="container">

    <!-- PAGE HEADER -->
    <div class="page-header">
        <h1>Add New Supply</h1>

        <a href="{{ url_for('dashboard') }}"
           class="btn secondary">
            Back to Dashboard
        </a>
    </div>

    <!-- SUPPLY INFORMATION FORM -->
    <div class="form-container">

        <h2>Supply Information</h2>
        <p>Enter the details of the supply below.</p>

        <form method="POST"
              action="{{ url_for('add_supply') }}">

            <div class="form-grid">

                <!-- FUNCTION 1: SUPPLY NAME -->
                <div class="form-group">
                    <label for="name">Supply Name *</label>

                    <input type="text"
                           id="name"
                           name="name"
                           placeholder="e.g. Coffee Beans"
                           maxlength="150"
                           required>
                </div>

                <!-- FUNCTION 2: CATEGORY -->
                <div class="form-group">
                    <label for="category">Category *</label>

                    <input type="text"
                           id="category"
                           name="category"
                           placeholder="e.g. Raw Materials"
                           maxlength="100"
                           required>
                </div>

                <!-- FUNCTION 3: QUANTITY -->
                <div class="form-group">
                    <label for="quantity">Quantity *</label>

                    <input type="number"
                           id="quantity"
                           name="quantity"
                           placeholder="Enter quantity"
                           min="0"
                           step="1"
                           required>
                </div>

                <!-- FUNCTION 4: UNIT PRICE -->
                <div class="form-group">
                    <label for="price">Unit Price (PHP) *</label>

                    <input type="number"
                           id="price"
                           name="price"
                           placeholder="e.g. 250.00"
                           min="0"
                           step="0.01"
                           required>
                </div>

                <!-- FUNCTION 5: EXPIRATION DATE -->
                <div class="form-group">
                    <label for="expiry_date">
                        Expiration Date *
                    </label>

                    <input type="date"
                           id="expiry_date"
                           name="expiry_date"
                           required>
                </div>

            </div>

            <!-- FORM BUTTONS -->
            <div class="form-footer">

                <button type="submit" class="btn">
                    Add Supply
                </button>

                <a href="{{ url_for('supplies') }}"
                   class="btn secondary">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
